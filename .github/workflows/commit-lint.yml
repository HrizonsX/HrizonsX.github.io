name: commit-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commit-lint:
    name: 校验 commit message 与 PR 标题
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 PR 内每个 commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            python3 scripts/check-commit-msg.py --text "$subject" --block-wip || failed=1
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $failed

      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-commit-msg.py --text "$PR_TITLE" --block-wip
