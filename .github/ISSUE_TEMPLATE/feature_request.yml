name: 需求提议
description: 想增加或改变某个能力
labels: ["✨ feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户在什么场景下卡住了，现在怎么绕过的
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级判断
      options:
        - P0 试点必须有
        - P1 试点期内补齐
        - P2 以后再说
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他
      description: 参考产品、约束、是否涉及学生个人数据或教务接口
