name: 缺陷报告
description: 功能与预期不符
labels: ["🐛 bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，最好带截图或录屏
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: 微信版本 / 机型 / 环境（local、dev、prod）
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 日志、traceId、影响范围。**不要粘贴真实学生数据或凭证**
